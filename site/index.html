<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Daily Brief" />
  <title>Daily Brief</title>
  <style>
    :root {
      --bg: #f4efe6;
      --paper: #fffaf3;
      --ink: #1d1915;
      --muted: #6e675e;
      --line: #e4dcd0;
      --accent: #2c5e3a;
      --accent-soft: #e4efe6;
      --bad: #8b2e2e;
      --warn: #8a5a18;
      --warn-bg: #f7ead3;
      --nav-h: 56px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 16px); }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100%; }
    body { padding: 24px 16px 72px; }
    body.unlocked { padding-top: calc(var(--nav-h) + 20px); }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-family: ui-serif, Georgia, "Times New Roman", serif; font-weight: 600;
      font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    h2 { font-family: ui-serif, Georgia, "Times New Roman", serif; font-weight: 600;
      font-size: 1.35rem; margin: 0 0 12px; letter-spacing: -0.01em; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
      padding: 20px; box-shadow: 0 1px 0 rgba(29,25,21,0.04); }
    section.card { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    input[type="password"] {
      width: 100%; font-size: 16px; padding: 14px 12px; border: 1px solid var(--line);
      border-radius: 10px; background: #fff; color: var(--ink);
    }
    button {
      margin-top: 12px; width: 100%; font-size: 1rem; padding: 14px 12px;
      border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600;
    }
    button.secondary { background: transparent; color: var(--muted); font-weight: 500; padding: 8px; margin-top: 8px; }
    .err { color: var(--bad); min-height: 1.2em; margin: 8px 0 0; font-size: 0.9rem; }
    .hidden { display: none !important; }
    #nav {
      position: sticky; top: 0; z-index: 30;
      margin: -20px -16px 20px; padding: 10px 16px;
      background: rgba(244, 239, 230, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    #nav a {
      flex: 0 0 auto; text-decoration: none; color: var(--ink);
      font-weight: 600; font-size: 0.92rem;
      padding: 10px 12px; border-radius: 999px;
    }
    #nav a:hover, #nav a.active { background: var(--accent); color: #fff; }
    .lock-btn { width: auto; margin: 0 0 0 auto; padding: 8px 12px; font-size: 0.85rem; }
    .greeting { font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: 1.7rem; margin: 0 0 8px; }
    .timeline { display: flex; flex-direction: column; gap: 10px; }
    .event {
      display: grid; grid-template-columns: 88px 1fr; gap: 12px;
      padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
      background: #fff;
    }
    .when { color: var(--accent); font-weight: 700; font-size: 0.82rem; line-height: 1.35; }
    .event h3 { margin: 0 0 4px; font-size: 1.02rem; font-weight: 650; }
    .meta { color: var(--muted); font-size: 0.88rem; }
    .mail-item, .note {
      padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
      background: #fff; margin-bottom: 10px;
    }
    .mail-item:last-child, .note:last-child { margin-bottom: 0; }
    .mail-item.important, .note.attention {
      border-color: #e2c48a; background: var(--warn-bg);
    }
    .from { color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .badge {
      display: inline-block; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.03em; text-transform: uppercase;
      padding: 4px 8px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
    }
    .badge.warn { background: #f0d7a8; color: var(--warn); }
    .badge.action { background: var(--accent); color: #fff; }
    .rows { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row.pending .name { color: var(--muted); text-decoration: line-through; }
    .chk { width: 22px; height: 22px; flex: 0 0 auto; accent-color: var(--accent); }
    .name { flex: 1; font-size: 1.05rem; min-width: 0; }
    .del { width: auto; margin-top: 0; padding: 8px 10px; background: transparent;
      color: var(--bad); font-weight: 600; font-size: 0.9rem; flex: 0 0 auto; }
    .empty { color: var(--muted); padding: 4px 0; }
    .section-kicker { color: var(--muted); font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 6px; }
    #toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      max-width: calc(100% - 32px); background: var(--ink); color: #fff;
      padding: 12px 16px; border-radius: 12px; font-size: 0.95rem;
      box-shadow: 0 8px 24px rgba(29,25,21,0.18); z-index: 40;
    }
    @media (max-width: 520px) {
      .event { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav id="nav" class="hidden" aria-label="Sections">
    <a href="#today">Today</a>
    <a href="#mail">Mail</a>
    <a href="#notes">Notes</a>
    <a href="#groceries">Groceries</a>
    <button type="button" class="lock-btn" id="lock">Lock</button>
  </nav>
  <main>
    <h1>Daily Brief</h1>
    <p class="sub" id="sub">Household home</p>
    <form id="gate" class="card" autocomplete="current-password">
      <label for="pw">Password</label>
      <input id="pw" type="password" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" required />
      <button type="submit">Unlock</button>
      <p class="err" id="err"></p>
    </form>
    <div id="brief" class="hidden">
      <p class="greeting" id="greeting"></p>
      <section class="card" id="today">
        <p class="section-kicker">Calendar</p>
        <h2>Today</h2>
        <div id="todayWrap"></div>
        <h2 style="margin-top:22px">Upcoming</h2>
        <div id="upcomingWrap"></div>
      </section>
      <section class="card" id="mail">
        <p class="section-kicker">Inbox</p>
        <h2>Mail</h2>
        <div id="mailWrap"></div>
      </section>
      <section class="card" id="notes">
        <p class="section-kicker">Notes</p>
        <h2>Attention</h2>
        <div id="notesWrap"></div>
      </section>
      <section class="card" id="groceries">
        <p class="section-kicker">List</p>
        <h2>Groceries</h2>
        <p class="sub" id="grocSub" style="margin-bottom:8px"></p>
        <div id="tableWrap"></div>
      </section>
    </div>
  </main>
  <div id="toast" class="hidden" role="status" aria-live="polite"></div>
  <script>
    const STORAGE = "household.groceries.pw";
    const PENDING = "household.groceries.pending";
    const DATA_URL = "data.enc.json";
    const TZ = "America/New_York";
    const $ = (id) => document.getElementById(id);
    let sessionPw = "";
    let sessionPkg = null;
    let sessionData = null;

    const b64ToBytes = (b64) => {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    };
    const bytesToB64 = (bytes) => {
      let bin = "";
      const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
      return btoa(bin);
    };
    function randomNonce() {
      const b = crypto.getRandomValues(new Uint8Array(16));
      return bytesToB64(b);
    }
    function loadPending() {
      try {
        const raw = localStorage.getItem(PENDING);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }
    function savePending(arr) {
      localStorage.setItem(PENDING, JSON.stringify(arr));
    }
    function addPending(entry) {
      const next = loadPending().filter((p) => !(p.name === entry.name && p.action === entry.action));
      next.push(entry);
      savePending(next);
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function asList(v) {
      if (!v) return [];
      return Array.isArray(v) ? v : [v];
    }
    function fmtWhen(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleString("en-CA", { timeZone: TZ, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET";
    }
    function fmtClock(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleTimeString("en-CA", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
    }
    function fmtDay(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleDateString("en-CA", { timeZone: TZ, weekday: "short", month: "short", day: "numeric" });
    }
    function showToast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.add("hidden"), 6000);
    }

    async function deriveKey(password, salt, iter) {
      const enc = new TextEncoder();
      const material = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }
    async function decryptPayload(pkg, password) {
      const key = await deriveKey(password, b64ToBytes(pkg.salt), pkg.iter);
      const pt = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(pkg.iv) },
        key,
        b64ToBytes(pkg.ct)
      );
      return JSON.parse(new TextDecoder().decode(pt));
    }
    async function encryptPayload(obj, password) {
      const iter = (sessionPkg && sessionPkg.iter) || 100000;
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt, iter);
      const ct = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        new TextEncoder().encode(JSON.stringify(obj))
      );
      return {
        v: 1,
        kdf: "PBKDF2-SHA256",
        iter,
        salt: bytesToB64(salt),
        iv: bytesToB64(iv),
        ct: bytesToB64(ct)
      };
    }
    async function hmacHex(password, message) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey("raw", enc.encode(password), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      const sig = await crypto.subtle.sign("HMAC", key, enc.encode(message));
      return [...new Uint8Array(sig)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    async function signedInner(action, name) {
      const clientAt = new Date().toISOString();
      const nonce = randomNonce();
      const mac = await hmacHex(sessionPw, "v1|" + action + "|" + name + "|" + clientAt + "|" + nonce);
      return { v: 1, action, name, clientAt, nonce, mac };
    }

    async function sendGithubIssue(pkg, gh) {
      const url = "https://api.github.com/repos/" + encodeURIComponent(gh.owner) + "/" + encodeURIComponent(gh.repo) + "/issues";
      const body = "```json\n" + JSON.stringify(pkg) + "\n```";
      const res = await fetch(url, {
        method: "POST",
        headers: {
          Authorization: "Bearer " + gh.token,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ title: "op", body, labels: gh.label ? [gh.label] : [] })
      });
      if (!res.ok) throw new Error("Could not send update");
    }

    function groceryBlock(data) {
      return (data && data.groceries) ? data.groceries : (data || {});
    }
    function mutateGh(data) {
      const groc = groceryBlock(data);
      return (groc.mutate && groc.mutate.gh) || (data && data.mutate && data.mutate.gh) || null;
    }
    function itemName(it) {
      if (it == null) return "";
      if (typeof it === "string") return it;
      return it.name || it.title || it.text || "";
    }

    async function sendMutation(action, name) {
      const inner = await signedInner(action, name);
      const pkg = await encryptPayload(inner, sessionPw);
      const gh = mutateGh(sessionData);
      if (gh && gh.owner && gh.repo && gh.token) {
        await sendGithubIssue(pkg, gh);
      }
    }

    function eventTitle(ev) {
      if (!ev) return "";
      if (typeof ev === "string") return ev;
      return ev.title || ev.summary || ev.name || "Event";
    }
    function eventWhenHtml(ev, withDay) {
      if (!ev || typeof ev === "string") return "";
      if (ev.allDay || ev.all_day) {
        const day = fmtDay(ev.start || ev.date) || "All day";
        return escapeHtml(day) + "<br>All day";
      }
      const start = ev.start || ev.startTime || ev.begin;
      const end = ev.end || ev.endTime;
      const day = withDay ? (fmtDay(start) + "<br>") : "";
      if (start && end) return day + escapeHtml(fmtClock(start) + " – " + fmtClock(end));
      if (start) return day + escapeHtml(fmtClock(start));
      return withDay ? day : "";
    }
    function renderEvents(list, withDay) {
      const items = asList(list).filter(Boolean);
      if (!items.length) return '<p class="empty">Nothing on the calendar.</p>';
      return '<div class="timeline">' + items.map((ev) => {
        const loc = ev && (ev.location || ev.place || ev.where);
        return '<article class="event">' +
          '<div class="when">' + eventWhenHtml(ev, withDay) + "</div>" +
          "<div><h3>" + escapeHtml(eventTitle(ev)) + "</h3>" +
          (loc ? '<div class="meta">' + escapeHtml(loc) + "</div>" : "") +
          "</div></article>";
      }).join("") + "</div>";
    }

    function mailSubject(m) {
      if (!m) return "";
      if (typeof m === "string") return m;
      return m.subject || m.title || m.summary || "Message";
    }
    function mailFrom(m) {
      if (!m || typeof m === "string") return "";
      return m.from || m.sender || m.fromName || "";
    }
    function mailSnippet(m) {
      if (!m || typeof m === "string") return "";
      return m.snippet || m.preview || m.body || m.text || "";
    }
    function mailAction(m) {
      if (!m || typeof m === "string") return "";
      return m.action || m.badge || m.cta || "";
    }
    function isImportant(m) {
      if (!m || typeof m === "string") return false;
      return !!(m.important || m.isImportant || m.flag || m.priority === "high");
    }
    function renderMailItems(items, forceImportant) {
      return items.filter(Boolean).map((m) => {
        const important = forceImportant || isImportant(m);
        const action = mailAction(m);
        const from = mailFrom(m);
        const snip = mailSnippet(m);
        return '<article class="mail-item' + (important ? " important" : "") + '">' +
          (from ? '<div class="from">' + escapeHtml(from) + "</div>" : "") +
          "<strong>" + escapeHtml(mailSubject(m)) + "</strong>" +
          (snip ? '<div class="meta" style="margin-top:6px">' + escapeHtml(snip) + "</div>" : "") +
          '<div class="badges">' +
            (important ? '<span class="badge warn">Important</span>' : "") +
            (action ? '<span class="badge action">' + escapeHtml(action) + "</span>" : "") +
          "</div></article>";
      }).join("");
    }
    function renderMail(mail) {
      if (!mail) return '<p class="empty">No mail in this brief.</p>';
      if (typeof mail === "string") return "<p>" + escapeHtml(mail) + "</p>";
      const summary = mail.summary || mail.overview || "";
      const important = asList(mail.important).filter((x) => typeof x !== "boolean");
      const items = asList(mail.items);
      let html = "";
      if (summary) html += "<p>" + escapeHtml(summary) + "</p>";
      if (important.length) {
        html += '<p class="section-kicker">Important</p>' + renderMailItems(important, true);
      }
      if (items.length) html += renderMailItems(items, mail.important === true);
      if (!html) return '<p class="empty">Inbox is quiet.</p>';
      return html;
    }

    function renderAttention(list) {
      const items = asList(list).filter(Boolean);
      if (!items.length) return '<p class="empty">Nothing needs attention.</p>';
      return items.map((n) => {
        if (typeof n === "string") return '<article class="note attention">' + escapeHtml(n) + "</article>";
        const title = n.title || n.heading || "Note";
        const body = n.body || n.text || n.detail || n.note || "";
        return '<article class="note attention"><strong>' + escapeHtml(title) + "</strong>" +
          (body ? '<div class="meta" style="margin-top:6px">' + escapeHtml(body) + "</div>" : "") +
          "</article>";
      }).join("");
    }

    function apply(data) {
      const groc = groceryBlock(data);
      const greeting = data.greeting || data.hello || "Good day.";
      $("greeting").textContent = greeting;
      $("sub").textContent = data.dateLabel || fmtDay(data.fetchedAt || groc.fetchedAt || new Date().toISOString()) || "Household home";
      const cal = data.calendar || {};
      $("todayWrap").innerHTML = renderEvents(cal.today || cal.events, false);
      $("upcomingWrap").innerHTML = renderEvents(cal.upcoming, true);
      $("mailWrap").innerHTML = renderMail(data.mail);
      $("notesWrap").innerHTML = renderAttention(data.attention || data.notes);

      const pending = loadPending();
      const items = asList(groc.items).map(itemName).filter(Boolean);
      const deleted = new Set(pending.filter((p) => p.action === "delete").map((p) => p.name));
      const checked = new Set(pending.filter((p) => p.action === "complete").map((p) => p.name));
      const visible = items.filter((name) => !deleted.has(name)).map((name) => ({
        name,
        checked: checked.has(name),
        pending: checked.has(name)
      }));
      const count = visible.filter((it) => !it.checked).length;
      $("grocSub").textContent = count + " open" + (groc.listName ? " on " + groc.listName : "") + (groc.fetchedAt ? " · updated " + fmtWhen(groc.fetchedAt) : "");
      if (!visible.length) {
        $("tableWrap").innerHTML = '<p class="empty">List is empty.</p>';
        return;
      }
      $("tableWrap").innerHTML = '<div class="rows">' + visible.map((it) => {
        return '<div class="row' + (it.pending ? " pending" : "") + '">' +
          '<input class="chk" type="checkbox"' + (it.checked ? " checked" : "") + ' data-name="' + escapeHtml(it.name) + '" />' +
          '<span class="name">' + escapeHtml(it.name) + "</span>" +
          '<button type="button" class="del" data-name="' + escapeHtml(it.name) + '">Delete</button>' +
          "</div>";
      }).join("") + "</div>";
    }

    async function onCheck(name, checked) {
      if (!checked) return;
      addPending({ action: "complete", name, at: Date.now() });
      apply(sessionData);
      showToast("Sent to Alexa. Usually shows on the speaker by the next sync (about 12 hours).");
      try {
        await sendMutation("complete", name);
      } catch (e) {
        $("err").textContent = "Could not send update.";
      }
    }
    async function onDelete(name) {
      addPending({ action: "delete", name, at: Date.now() });
      apply(sessionData);
      showToast("Sent to Alexa. Usually shows on the speaker by the next sync (about 12 hours).");
      try {
        await sendMutation("delete", name);
      } catch (e) {
        $("err").textContent = "Could not send update.";
      }
    }

    function markNav() {
      const hash = (location.hash || "#today").slice(1);
      document.querySelectorAll("#nav a").forEach((a) => {
        a.classList.toggle("active", a.getAttribute("href") === "#" + hash);
      });
    }

    async function tryUnlock(password, fromStorage) {
      $("err").textContent = "";
      try {
        const pkg = await fetch(DATA_URL, { cache: "no-store" }).then((r) => {
          if (!r.ok) throw new Error("Could not load list");
          return r.json();
        });
        const data = await decryptPayload(pkg, password);
        sessionPw = password;
        sessionPkg = pkg;
        sessionData = data;
        localStorage.setItem(STORAGE, password);
        $("gate").classList.add("hidden");
        $("brief").classList.remove("hidden");
        $("nav").classList.remove("hidden");
        document.body.classList.add("unlocked");
        apply(data);
        markNav();
        if (location.hash) {
          const el = document.querySelector(location.hash);
          if (el) el.scrollIntoView({ block: "start" });
        }
      } catch (e) {
        if (!fromStorage) $("err").textContent = "Wrong password or brief unavailable.";
        localStorage.removeItem(STORAGE);
        $("gate").classList.remove("hidden");
        $("brief").classList.add("hidden");
        $("nav").classList.add("hidden");
        document.body.classList.remove("unlocked");
      }
    }

    $("gate").addEventListener("submit", (ev) => {
      ev.preventDefault();
      tryUnlock($("pw").value, false);
    });
    $("lock").addEventListener("click", () => {
      localStorage.removeItem(STORAGE);
      sessionPw = "";
      sessionPkg = null;
      sessionData = null;
      $("pw").value = "";
      $("brief").classList.add("hidden");
      $("nav").classList.add("hidden");
      $("gate").classList.remove("hidden");
      document.body.classList.remove("unlocked");
      $("sub").textContent = "Household home";
      $("pw").focus();
    });
    $("tableWrap").addEventListener("change", (ev) => {
      const el = ev.target;
      if (!el.classList.contains("chk")) return;
      onCheck(el.getAttribute("data-name"), el.checked);
    });
    $("tableWrap").addEventListener("click", (ev) => {
      const el = ev.target.closest(".del");
      if (!el) return;
      onDelete(el.getAttribute("data-name"));
    });
    window.addEventListener("hashchange", markNav);
    const saved = localStorage.getItem(STORAGE);
    if (saved) tryUnlock(saved, true);
  </script>
